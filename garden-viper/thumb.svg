<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#18352a"/>
      <rect width="20" height="20" fill="#1d3d30"/>
      <rect x="20" y="20" width="20" height="20" fill="#1d3d30"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#tiles)"/>
  <rect width="400" height="300" fill="url(#vig)"/>
  <!-- snake body -->
  <path d="M70 230 L70 190 L150 190 L150 110 L250 110" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 4)"/>
  <path d="M70 230 L70 190 L150 190 L150 110 L250 110" fill="none" stroke="#e0743a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 190 L150 110 L250 110" fill="none" stroke="#ff7b54" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M146 186 L146 106 L246 106" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="256" cy="110" r="20" fill="#ff7b54"/>
  <path d="M274 110 L292 110 M292 110 l7 -6 M292 110 l7 6" stroke="#ff3d5a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="262" cy="101" r="6.5" fill="#fffaf0"/><circle cx="262" cy="119" r="6.5" fill="#fffaf0"/>
  <circle cx="265" cy="103" r="3.4" fill="#1a0f0a"/><circle cx="265" cy="121" r="3.4" fill="#1a0f0a"/>
  <!-- apple -->
  <circle cx="330" cy="190" r="26" fill="#e8434a" opacity=".2"/>
  <circle cx="323" cy="192" r="12" fill="#e8434a"/><circle cx="337" cy="192" r="12" fill="#e8434a"/>
  <path d="M330 182 L332 172" stroke="#5a3a1c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="338" cy="173" rx="7" ry="3.5" fill="#6fcf7a" transform="rotate(-28 338 173)"/>
  <!-- golden star -->
  <path d="M330 60 l5 11 12 1 -9 8 3 12 -11 -6 -11 6 3 -12 -9 -8 12 -1z" fill="#ffd84a"/>
  <circle cx="330" cy="76" r="24" fill="none" stroke="#ffd84a" stroke-width="3" stroke-dasharray="110 200" stroke-linecap="round" transform="rotate(-90 330 76)"/>
  <!-- title -->
  <text x="200" y="278" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#f0ead6" stroke="#0e1c17" stroke-width="6" paint-order="stroke">GARDEN <tspan fill="#ff7b54">VIPER</tspan></text>
</svg>
