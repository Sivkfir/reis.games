<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7cc254"/>
      <rect width="20" height="20" fill="#74b84d"/>
      <rect x="20" y="20" width="20" height="20" fill="#74b84d"/>
    </pattern>
    <radialGradient id="mine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c56bff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#c56bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grass)"/>
  <rect width="70" height="300" fill="#2f8cff" opacity=".18"/>
  <rect x="330" width="70" height="300" fill="#ff4057" opacity=".18"/>
  <!-- crates -->
  <g stroke="#7a4420" stroke-width="2">
    <rect x="120" y="40" width="40" height="40" fill="#d9914f"/>
    <rect x="240" y="220" width="40" height="40" fill="#d9914f"/>
    <rect x="120" y="200" width="40" height="40" fill="#d9914f"/>
    <rect x="240" y="60" width="40" height="40" fill="#d9914f"/>
  </g>
  <!-- bushes -->
  <g fill="#2b7a35">
    <circle cx="40" cy="60" r="20"/><circle cx="64" cy="66" r="18"/><circle cx="52" cy="44" r="16"/>
    <circle cx="350" cy="240" r="20"/><circle cx="326" cy="246" r="18"/><circle cx="338" cy="224" r="16"/>
  </g>
  <!-- mine + gems -->
  <circle cx="200" cy="150" r="60" fill="url(#mine)"/>
  <circle cx="200" cy="150" r="26" fill="#3b2160"/>
  <g fill="#c56bff" stroke="#efd2ff" stroke-width="2">
    <path d="M200 128 l10 10 -10 14 -10 -14z"/>
    <path d="M176 164 l8 8 -8 11 -8 -11z"/>
    <path d="M226 160 l8 8 -8 11 -8 -11z"/>
  </g>
  <!-- bolt -->
  <path d="M120 150 L180 140" stroke="#fff27a" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <!-- blue hero (Spark) -->
  <g transform="translate(96 156)">
    <ellipse cx="0" cy="22" rx="26" ry="11" fill="none" stroke="#2f8cff" stroke-width="4"/>
    <path d="M-17 -16 L-13 -34 L-5 -18 M-6 -18 L0 -38 L6 -18 M5 -18 L13 -34 L17 -16" fill="#b07d00"/>
    <rect x="8" y="-6" width="30" height="12" rx="5" fill="#2b2f36"/>
    <circle r="22" cy="-2" fill="#ffcf3a" stroke="#b07d00" stroke-width="3"/>
    <ellipse cx="-3" cy="-3" rx="5.5" ry="6.5" fill="#fff"/><ellipse cx="13" cy="-3" rx="5.5" ry="6.5" fill="#fff"/>
    <circle cx="-1" cy="-2" r="3" fill="#1b1f27"/><circle cx="15" cy="-2" r="3" fill="#1b1f27"/>
  </g>
  <!-- red hero (Boulder) -->
  <g transform="translate(300 140)">
    <ellipse cx="0" cy="22" rx="26" ry="11" fill="none" stroke="#ff4057" stroke-width="4"/>
    <rect x="-38" y="-6" width="30" height="12" rx="5" fill="#2b2f36"/>
    <circle r="22" cy="-2" fill="#ff8a3d" stroke="#a8491a" stroke-width="3"/>
    <path d="M-22 -6 A23 23 0 0 1 22 -6 Z" fill="#6b7280"/>
    <rect x="-22" y="-9" width="44" height="6" rx="3" fill="#9ca3af"/>
    <ellipse cx="-13" cy="2" rx="5.5" ry="6.5" fill="#fff"/><ellipse cx="3" cy="2" rx="5.5" ry="6.5" fill="#fff"/>
    <circle cx="-15" cy="3" r="3" fill="#1b1f27"/><circle cx="1" cy="3" r="3" fill="#1b1f27"/>
  </g>
  <!-- title -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff6e3" stroke="#16202b" stroke-width="6" paint-order="stroke">REI ARENA</text>
</svg>
